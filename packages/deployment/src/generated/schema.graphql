type Chart {
  id: ID!
  tenantId: String!
  root: String!
  author: String!
  title: String!
  structure: AWSJSON!
  plan: [String!]!
  links: [String!]!
  tags: [String!]!
  isActive: Boolean!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

input CreateChartInput {
  root: String!
  tenantId: String!
  title: String!
  author: String
  structure: AWSJSON!
  plan: [String!]!
  links: [String!]
  tags: [String!]
}

type Query {
  getChart(chartId: ID!, tenantId: String!): Chart
  listCharts(tenantId: String!): [Chart!]!
  myProfile: MusicianProfile
  myUnavailability(from: AWSDate!, to: AWSDate!): [Unavailability!]!
}

type Mutation {
  createChart(input: CreateChartInput!): Chart!
  saveMyProfile(input: SaveProfileInput!): MusicianProfile!
  addUnavailability(input: UnavailabilityInput!): Unavailability!
  updateUnavailability(id: ID!, input: UnavailabilityInput!): Unavailability!
  removeUnavailability(id: ID!): Boolean!
}

enum ContactChannel {
  WHATSAPP
  SMS
  EMAIL
  PHONE_CALL
}

enum SkillLevel {
  BEGINNER
  INTERMEDIATE
  ADVANCED
  PROFESSIONAL
  MASTER
}

type Region {
  country: String!
  area: String
}

type RoleTag {
  role: String!
  detail: String
  isPrimary: Boolean!
  level: SkillLevel
}

type StyleTag {
  style: String!
  detail: String
}

type MusicianProfile {
  userId: ID!
  name: String!
  email: String!
  phone: String
  preferredChannel: ContactChannel!
  region: Region
  roles: [RoleTag!]!
  styles: [StyleTag!]!
  version: Int!
  createdAt: AWSDateTime!
  updatedAt: AWSDateTime!
}

type Unavailability {
  id: ID!
  from: AWSDate!
  to: AWSDate!
  reason: String
  appliesToAllBands: Boolean!
  bandIds: [ID!]!
}

input RegionInput {
  country: String!
  area: String
}

input RoleTagInput {
  role: String!
  detail: String
  isPrimary: Boolean!
  level: SkillLevel
}

input StyleTagInput {
  style: String!
  detail: String
}

input SaveProfileInput {
  name: String!
  phone: String
  preferredChannel: ContactChannel!
  region: RegionInput
  roles: [RoleTagInput!]!
  styles: [StyleTagInput!]!
}

"No bandIds (or an empty list) means the entry applies to every band."
input UnavailabilityInput {
  from: AWSDate!
  to: AWSDate!
  reason: String
  bandIds: [ID!]
}

schema {
  query: Query
  mutation: Mutation
}