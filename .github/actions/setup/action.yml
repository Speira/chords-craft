name: Setup
description: Install pnpm + Node.js (versions from package.json devEngines) and the workspace dependencies.

runs:
  using: composite
  steps:
    - name: Install pnpm, Node.js and dependencies
      uses: pnpm/setup@v2
      with:
        # pnpm comes from devEngines.packageManager. Node is pinned to the LTS major here so CI
        # stays reproducible while devEngines.runtime only sets a minimum.
        runtime: node@24
        cache: true
        require-lockfile: true
