name: Setup
description: Install pnpm + Node.js and the workspace dependencies. Both versions are pinned here; see the notes below.

runs:
  using: composite
  steps:
    - name: Install pnpm, Node.js and dependencies
      uses: pnpm/setup@v2
      with:
        # TEMPORARY PIN. pnpm comes from devEngines.packageManager (`^11.17.0`), which now
        # resolves to 11.27.1 — a release whose binary reports itself as 11.27.0, so this
        # action's own version check fails and no job gets as far as installing:
        #   Error: The installed pnpm reports version 11.27.0, expected 11.27.1
        # Drop this line once pnpm ships a release that reports its own version correctly.
        version: 11.27.0
        # Node is pinned to the LTS major here so CI stays reproducible while
        # devEngines.runtime only sets a minimum.
        runtime: node@24
        cache: true
        require-lockfile: true
