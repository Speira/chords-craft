name: PR title

# PRs are squash-merged, so the PR title becomes the commit on main: it must follow
# Conventional Commits, like the commit-msg hook (scripts/checkCommitMessage.ts).
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    name: Conventional Commits title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false
          disallowScopes: |
            wip
            temp
          subjectPattern: ^\S.*$
          subjectPatternError: The subject "{subject}" must not be empty or start with a space.
